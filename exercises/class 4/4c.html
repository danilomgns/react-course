<!DOCTYPE html>
<html>
  <head>
    <title>Exercise</title>
    <style>
      .button-on {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        padding: 12px 15px;
        border-radius: 8px;
        cursor: pointer;
      }

      .button-off {
        background-color: rgb(220, 53, 69);
        color: white;
        border: none;
        padding: 12px 15px;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script> <!-- to mobile we use ReactNative --> 

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      function App() {
        const [isButtonOn, setIsButtonOn] = React.useState(true);

        function setButton() {
          if (isButtonOn) {
            setIsButtonOn(false);
          } else {
            setIsButtonOn(true);
          }
        }

        return (
          <button 
            className={isButtonOn ? "button-on" : "button-off"}
            onClick={setButton}
          >
            {isButtonOn ? 'ON' : 'OFF'}
          </button>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
