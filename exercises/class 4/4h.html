<!DOCTYPE html>
<html>
  <head>
    <title>Exercise</title>
    <style>
      body {
        margin-top: 0;
        margin-bottom: 0;
      }
      
      button {
        background-color: rgb(25, 165, 84);
        color: white;
        padding: 8px 16px;
        margin: 0px 5px;
        border: none;
      }

      .container-buttons {
        background-color: rgb(222, 222, 222);
        display: flex;
        justify-content: center;
        align-items: center;

        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script> <!-- to mobile we use ReactNative --> 

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      function App() {
        const [count, setCount] = React.useState(0);
        const [isAutoClickOn, setIsAutoClickOn] = React.useState(false);
        const [myInterval, setMyInterval] = React.useState('');

        const countButtonRef = React.useRef(null);
        
        function increaseCount() {
          setCount(count + 1);
        }

        function resetCounter() {
          setCount(0);
        }

        function autoClickCounter() {
          if (!isAutoClickOn) {
            const buttonElem = countButtonRef.current;

            setMyInterval(setInterval(() => {
              buttonElem.click();
            }, 1000));
            
            setIsAutoClickOn(true);

          } else {
            clearInterval(myInterval);
            setIsAutoClickOn(false);
          }
        }

        return (
          <div className="container-buttons">
            <button onClick={increaseCount} ref={countButtonRef}>
              Clicked {count} {count === 1 ? 'time' : 'times'}
            </button>
            <button onClick={resetCounter}>
              Reset
            </button>
            <button onClick={autoClickCounter}>
              {isAutoClickOn ? 'Auto Click (ON)' : 'Auto Click (OFF)'}
            </button>
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
