<!DOCTYPE html>
<html>
  <head>
    <title>Exercise</title>
    <style>
      .welcome-paragraph {
        font-size: 22px;
        font-family: Arial;
      }

      .login-input {
        padding: 8px 12px;
        border-radius: 6px;
        border-width: 1px;
        margin-bottom: 10px;
      }

      .login-button {
        background-color: rgb(0, 123, 255);
        color: white;
        border: none;
        padding: 12px 15px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script> <!-- to mobile we use ReactNative --> 

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      function MenuMessage() {
        return (
          <>
            <p className="welcome-paragraph">Hello, welcome to my website</p>
          </>
        );
      }

      function LoginForm() {
        return (
          <>  
            <div>
              <input className="login-input" placeholder="Email" />
            </div>
            <div>
              <input className="login-input" placeholder="Password" type="password"/>
            </div>
            <div>
              <button className="login-button">Login</button>
              <button className="login-button">Sign up</button>  
            </div>
          </>
        );
      }

      function App() {
        return (
          <>
            <MenuMessage />
            <LoginForm />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
