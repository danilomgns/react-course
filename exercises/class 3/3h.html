<!DOCTYPE html>
<html>
  <head>
    <title>Exercise</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script> <!-- to mobile we use ReactNative --> 

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      function App() {
        const [input, setInput] = React.useState('');
        
        function saveInput(event) {
          setInput(event.target.value)
        }

        function resetInput() {
          setInput('');
        }

        function exampleInput() {
          const examples = ['Danilo', 'Ana', 'Estêvão', 'Ernani'];
          setInput(examples[Math.floor(Math.random() * examples.length)]);
        }

        return (
          <>
            <input 
              onChange={saveInput} 
              value={input}
            />
            <button onClick={resetInput}>Reset</button>
            <button onClick={exampleInput}>Example</button>
            <p>{input}</p>
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
