<!DOCTYPE html>
<html>
  <head>
    <title>Exercise</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script> <!-- to mobile we use ReactNative --> 

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

      function ProductDetails({ name, imageSrc, price, discountPrice }) {
        return (
          <div>
            <img src={imageSrc} width="100"/>
            <p>{name}</p>

            {discountPrice ? (
              <>
                <p><del>Price: ${price}</del></p>
                <p>Discount price: ${discountPrice}</p>
              </>
            ) : (
              <p>Price: ${price}</p>
            )}

            <button>Add to Cart</button>
          </div>
        );
      }

      function App() {
        return (
          <>
            <ProductDetails 
              name="Cotton socks" 
              price="10.90" 
              discountPrice="5.45"
              imageSrc="cotton-socks.png"
            />
            <ProductDetails 
              name="Tennis balls" 
              price="6.00"
              imageSrc="tennis-balls.png"
            />
            <ProductDetails 
              name="Plain T-shirt" 
              price="7.99"
              imageSrc="plain-t-shirt.png"
            />
          </>        
        );
      }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);

      root.render(<App />);

    </script>
  </body>
</html>
